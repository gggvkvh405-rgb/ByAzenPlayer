name: Build Windows app

on:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Smoke test renderer
        run: node tools/smoke-test.js

      - name: Fetch Electron runtime
        run: |
          cd app
          npm install --no-save --no-package-lock --no-audit --no-fund electron@32.2.0 rcedit@4.0.1
          node -e "const p=require.resolve('electron');console.log('electron module:',p)"

      - name: Assemble portable build
        shell: pwsh
        run: |
          $out = "app/dist/ByAzen-win32-x64"
          Remove-Item -Recurse -Force app/dist -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -Recurse -Force app/node_modules/electron/dist/* $out/
          Remove-Item -Force "$out/default_app.asar" -ErrorAction SilentlyContinue

          $appDir = "$out/resources/app"
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          Copy-Item -Force app/main.js, app/preload.js, app/package.json $appDir/
          Copy-Item -Recurse -Force app/renderer $appDir/renderer

          Rename-Item -Force "$out/electron.exe" "ByAzen.exe"
          Write-Host "payload before stamp:"
          Get-ChildItem $out | Select-Object Name | Format-Table

      - name: Stamp icon and version info
        continue-on-error: true
        shell: pwsh
        run: |
          $env:NODE_PATH = (Resolve-Path "app/node_modules").Path
          node tools/stamp-exe.cjs "app/dist/ByAzen-win32-x64/ByAzen.exe" "app/build/icon.ico"
          exit 0

      - name: Launch test
        shell: pwsh
        run: |
          $exe = (Resolve-Path "app/dist/ByAzen-win32-x64/ByAzen.exe").Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "ByAzen.exe exited during startup (code $($p.ExitCode))" }
          Write-Host "ByAzen.exe is running (pid $($p.Id))"
          Get-Process -Name ByAzen -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host "build verified"

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path app/dist/ByAzen-win32-x64/* -DestinationPath ByAzen-win32-x64-portable.zip -CompressionLevel Optimal
          "{0:N1} MB" -f ((Get-Item ByAzen-win32-x64-portable.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: ByAzen-windows
          path: |
            ByAzen-win32-x64-portable.zip
            app/dist/ByAzen-win32-x64/ByAzen.exe
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        run: |
          $tag = "v1.0.0"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "ByAzen 1.0.0" --notes "Portable Windows build. Unzip, then run ByAzen.exe. Eight original demo tracks are bundled." --target $env:GITHUB_SHA
          }
          gh release upload $tag ByAzen-win32-x64-portable.zip --repo $env:GITHUB_REPOSITORY --clobber
          exit 0
